nav:
  - Введение: getting_started/index.md
  - Руководство пользователя:
      - Обзор: user_guide/index.md
      - Виртуальные машины: user_guide/virtual_machines.md
#          - Обзор: user_guide/virtual_machines.md/index.md
#          - Создать: user_guide/virtual_machines/create.md
#          - Редактировать: user_guide/virtual_machines/edit.md
#          - Удалить: user_guide/virtual_machines/delete.md
#          - Подключить диск: user_guide/virtual_machines/attach_disk.md
#          - Миграция: user_guide/virtual_machines/migrate.md
#          - FAQ: user_guide/virtual_machines/faq.md
#          - Известные проблемы: user_guide/virtual_machines/known_issues.md
      - Виртуальные тома: user_guide/volumes.md
#          - Обзор: user_guide/volumes/index.md
#          - Создать: user_guide/volumes/create.md
#          - Расширить: user_guide/volumes/extend.md
#          - Удалить: user_guide/volumes/delete.md
#          - Монтировать: user_guide/volumes/mount.md
#          - Отсоединить: user_guide/volumes/detach.md
#          - FAQ: user_guide/volumes/faq.md
#          - Известные проблемы: user_guide/volumes/known_issues.md
      - Хранилища:
          - Обзор: user_guide/storages.md
      - Сеть:
          - Обзор: user_guide/network.md
          # ... и другие разделы сети
      # ... остальные модули по аналогии
  - Справочник:
      - Обзор: reference/index.md
      - Модули:
          - Обзор: reference/modules/index.md
          - Виртуальные машины: reference/modules/virtual_machines.md
          - Виртуальные тома: reference/modules/volumes.md
          # ... другие спецификации модулей
      - API: reference/api.md
  - Вклад и разработка:
      - Обзор: contributing/index.md
      - Основное: contributing/general.md
      - Тесты: contributing/tests.md
  - Архитектура:
      - Обзор: architecture/index.md
      - Термины: architecture/general_terms.md
      - General Module:
          - Adapters: architecture/general_module/adapters.md
          - Domain: architecture/general_module/domain.md
          - Entrypoints: architecture/general_module/entrypoints.md
          - Введение: architecture/general_module/introduction.md
          - module_dir: architecture/general_module/module_dir.md
          - service_layer: architecture/general_module/service_layer.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption

plugins:
  - glightbox

theme:
  name: material
  features:
    - header.autohide
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/white-balance-sunny
        name: Переключить на светлую тему
